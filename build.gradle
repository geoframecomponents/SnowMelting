apply plugin: 'java'
apply plugin: 'eclipse'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

// to get project version from command line, just type
// $ gradle -PprojVersion=<version_number> build
// default is na
if (project.hasProperty('projVersion')) {
      project.version = project.projVersion
} else {
      project.version = 'na'
}

// name with versioning of the jar file
jar {
    manifest {
        attributes 'Implementation-Title' : 'Gradle Quickstart',
                   'Implementation-Version': version
    }
}

repositories {

    maven {
        // jai_core 1.1.3
        // jai_codec 1.1.3
        //url 'http://download.osgeo.org/webdav/geotools/'
        url 'https://repo.osgeo.org/repository/release'
    }

    maven {
        // hatbox 1.0.b7
        url 'https://maven.geo-solutions.it/'
    }

    mavenCentral() //jgt

    mavenLocal()

    flatDir {
        dirs 'lib'
    }
}

dependencies {
	    
    // https://mvnrepository.com/artifact/org.jgrasstools/jgt-grass
    //compile group: 'org.hortonmachine', name: 'hm-grass', version: '0.10.4'
    // https://mvnrepository.com/artifact/org.jgrasstools/jgt-hortonmachine
    implementation group: 'org.hortonmachine', name: 'hm-hmachine', version: '0.10.11'
    // https://mvnrepository.com/artifact/org.jgrasstools/jgt-jgrassgears
    implementation group: 'org.hortonmachine', name: 'hm-gears', version: '0.10.11'
    // https://mvnrepository.com/artifact/org.jgrasstools/jgt-modules
    implementation group: 'org.hortonmachine', name: 'hm-modules', version: '0.10.11'
    // https://mvnrepository.com/artifact/org.jgrasstools/jgt-oms3
    //compile group: 'org.hortonmachine', name: 'jgt-oms3', version: '0.10.4'
    implementation group: 'net.sourceforge.hatbox', name: 'hatbox', version: '1.0.b7'   
     implementation group: 'org.geoframe', name: 'numerical', version: '1.0.4-SNAPSHOT'
    
    implementation 'org.geotools:gt-main:34.0'
    implementation group: 'junit', name: 'junit', version: '4.+'

}
